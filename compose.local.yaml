services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "timezone=Asia/Seoul", "-c", "log_timezone=Asia/Seoul"]
    environment:
      TZ: 'Asia/Seoul'
      PGTZ: 'Asia/Seoul'
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - travelhunter-db:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://travelhunter:travelhunter@db:5432/travelhunter}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-change-me-secret-key-32-bytes}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-travel_hunter_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}
      NOTIFICATION_SCHEDULER_ENABLED: ${NOTIFICATION_SCHEDULER_ENABLED:-false}
      NOTIFICATION_RUN_AT: ${NOTIFICATION_RUN_AT:-09:00}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-60}
      NOTIFICATION_RETRY_ENABLED: ${NOTIFICATION_RETRY_ENABLED:-true}
      NOTIFICATION_RETRY_MAX_ATTEMPTS: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:-3}
      NOTIFICATION_RETRY_DELAY_SECONDS: ${NOTIFICATION_RETRY_DELAY_SECONDS:-600}
      EXTERNAL_COLLECTION_SCHEDULER_ENABLED: ${EXTERNAL_COLLECTION_SCHEDULER_ENABLED:-false}
      EXTERNAL_COLLECTION_RUN_AT: ${EXTERNAL_COLLECTION_RUN_AT:-03:00}
      EXTERNAL_COLLECTION_POLL_SECONDS: ${EXTERNAL_COLLECTION_POLL_SECONDS:-60}
      KAKAO_LOCAL_ENABLED: ${KAKAO_LOCAL_ENABLED:-false}
      KAKAO_LOCAL_REST_API_KEY: ${KAKAO_LOCAL_REST_API_KEY:-}
      KAKAO_LOCAL_TIMEOUT_SECONDS: ${KAKAO_LOCAL_TIMEOUT_SECONDS:-5}
      TOUR_API_ENABLED: ${TOUR_API_ENABLED:-false}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY:-}
      TOUR_API_BASE_URL: ${TOUR_API_BASE_URL:-https://apis.data.go.kr/B551011/KorService2}
      TOUR_API_TIMEOUT_SECONDS: ${TOUR_API_TIMEOUT_SECONDS:-5}
      PIXABAY_ENABLED: ${PIXABAY_ENABLED:-false}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      PIXABAY_TIMEOUT_SECONDS: ${PIXABAY_TIMEOUT_SECONDS:-5}
      TRAVEL_HUNTER_PUBLIC_BASE_URL: ${TRAVEL_HUNTER_PUBLIC_BASE_URL:-http://127.0.0.1:4173}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/oauth/kakao/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/oauth/google/callback}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-travel_hunter_oauth_state}
      # 구조화 로그 - docs/superpowers/plans/2026-09-22-caddy-service-status-log.md
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/travelhunter/backend.log}
      # 확정한 사진 원본(사진 검토 0047) - 볼륨 travelhunter-media. 백엔드가 /api/media 로 내보낸다
      MEDIA_ROOT: ${MEDIA_ROOT:-/media}
      LOG_FILE_MAX_MB: ${LOG_FILE_MAX_MB:-20}
      LOG_FILE_BACKUPS: ${LOG_FILE_BACKUPS:-10}
      ACCESS_LOG_EXCLUDE_PATHS: ${ACCESS_LOG_EXCLUDE_PATHS:-/api/health,/health}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_DEBUG_BODIES: ${LOG_DEBUG_BODIES:-false}
      LOG_DEBUG_BODY_PATHS: ${LOG_DEBUG_BODY_PATHS:-}
      LOG_DEBUG_BODY_FIELDS: ${LOG_DEBUG_BODY_FIELDS:-}
      LOG_DEBUG_BODY_USER: ${LOG_DEBUG_BODY_USER:-}
      LOG_DEBUG_BODY_UNTIL: ${LOG_DEBUG_BODY_UNTIL:-}
      LOG_DEBUG_BODIES_ALLOW_PROTECTED: ${LOG_DEBUG_BODIES_ALLOW_PROTECTED:-false}
      LOG_DEBUG_OPERATOR_USER_ID: ${LOG_DEBUG_OPERATOR_USER_ID:-}
    volumes:
      # 컨테이너를 재생성해도 남는 로그 사본
      - travelhunter-logs:/var/log/travelhunter
      - travelhunter-media:/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:-}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-}
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

volumes:
  travelhunter-db:
  travelhunter-logs:
  travelhunter-media:
