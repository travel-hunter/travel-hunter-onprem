include:
  - compose.local.yaml

services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      TRAVEL_HUNTER_PUBLIC_BASE_URL: ${TRAVEL_HUNTER_PUBLIC_BASE_URL:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # caddy 컨테이너가 보내는 연결만 프록시 헤더를 믿는다. compose 기본 네트워크는 172.16.0.0/12 안에 생긴다.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      
  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:?set VITE_ADMIN_BASE_URL}
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${STAGING_DOMAIN:-},${ADMIN_DOMAIN:-}
    depends_on:
      backend:
        condition: service_healthy
        
  caddy:
    image: caddy:2-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-dev.localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.dev.localhost}
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      caddy:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"