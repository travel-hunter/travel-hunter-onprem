services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "timezone=Asia/Seoul", "-c", "log_timezone=Asia/Seoul"]
    environment:
      POSTGRES_DB: travelhunter
      POSTGRES_USER: travelhunter
      POSTGRES_PASSWORD: travelhunter
      TZ: Asia/Seoul
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelhunter -d travelhunter"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - travelhunter-db:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      TZ: Asia/Seoul
      DATABASE_URL: postgresql+psycopg://travelhunter:travelhunter@db:5432/travelhunter
      AUTH_SECRET_KEY: dev-only-change-me-secret-key-32-bytes
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "14"
      REFRESH_COOKIE_NAME: travel_hunter_refresh
      REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173
      NOTIFICATION_SCHEDULER_ENABLED: "false"
      NOTIFICATION_RUN_AT: "09:00"
      NOTIFICATION_POLL_SECONDS: "60"
      NOTIFICATION_RETRY_ENABLED: "true"
      NOTIFICATION_RETRY_MAX_ATTEMPTS: "3"
      NOTIFICATION_RETRY_DELAY_SECONDS: "600"
      EXTERNAL_COLLECTION_SCHEDULER_ENABLED: "false"
      EXTERNAL_COLLECTION_RUN_AT: "03:00"
      EXTERNAL_COLLECTION_POLL_SECONDS: "60"
      KAKAO_LOCAL_ENABLED: ${KAKAO_LOCAL_ENABLED:-false}
      KAKAO_LOCAL_REST_API_KEY: ${KAKAO_LOCAL_REST_API_KEY:-}
      KAKAO_LOCAL_TIMEOUT_SECONDS: ${KAKAO_LOCAL_TIMEOUT_SECONDS:-5}
      TRAVEL_HUNTER_PUBLIC_BASE_URL: http://127.0.0.1:4173
      PASSWORD_RESET_EXPIRE_MINUTES: "30"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ""
      SMTP_USE_TLS: "true"
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/oauth/kakao/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/oauth/google/callback}
      OAUTH_STATE_COOKIE_NAME: travel_hunter_oauth_state
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:-}
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  travelhunter-db:
